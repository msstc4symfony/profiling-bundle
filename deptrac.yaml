# Canonical layers of the msstc4symfony bundle standard (stage B spec, section 2).
# Copy as-is; replace the BundleRoot value with ^<bundle class>$ (deptrac reads an unanchored regex: anchors and
# doubled backslashes, e.g. ^Msstc4Symfony\\FooBundle\\FooBundle$).
# A bundle may drop dependencies from the ruleset, never add them.
deptrac:
    paths:
        - ./src

    layers:
        - name: Domain
          collectors:
              - type: directory
                value: src/Domain/(Entity|Document|ValueObject|Enum|Event|Repository|DocumentRepository)/.*

        - name: DomainService
          collectors:
              - type: directory
                value: src/Domain/(Service|Helper|Specification)/.*

        - name: Application
          collectors:
              - type: directory
                value: src/Application/.*

        - name: Infrastructure
          collectors:
              - type: directory
                value: src/Infrastructure/.*

        - name: Presentation
          collectors:
              - type: directory
                value: src/Presentation/.*

        - name: Framework
          collectors:
              - type: directory
                value: src/Framework/.*

        - name: DependencyInjection
          collectors:
              - type: directory
                value: src/DependencyInjection/.*

        - name: BundleRoot
          collectors:
              - type: classLike
                value: ^Msstc4Symfony\\ProfilingBundle\\ProfilingBundle$

    ruleset:
        # Spans, the factory, assemblers, decision makers and processors.
        Application: ~

        # Request, console and message listeners open and close spans through the factory.
        Presentation:
            - Application

        BundleRoot: ~
