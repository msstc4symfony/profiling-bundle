name: Code Quality Checks

on:
  workflow_dispatch:
  # Weekly, so a new advisory or a broken dependency shows up without a push.
  schedule:
    - cron: '24 4 * * 1'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - LICENSE
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - LICENSE

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  standard:
    uses: msstc4symfony/bundle-standard/.github/workflows/php-bundle.yml@v4.4.0
    with:
      extensions: 'mbstring, xml, ctype, iconv, intl, json, pdo_sqlite'
      infection-min-msi: 82
      infection-min-covered-msi: 82
